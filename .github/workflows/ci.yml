name: CI

on:
  pull_request:
  push:
    branches: [main]

# 9.5: the repo is public; CI only reads it.
permissions:
  contents: read

jobs:
  # 11.11: two sessions both shipped 11.9.0. A pull request's version has to be newer than main's when it's checked;
  # scripts/bump-version.sh rebase renumbers it onto the next one.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Newer than main
        run: |
          mine="$(tr -d '[:space:]' < VERSION)"
          main="$(git show "origin/${{ github.base_ref }}:VERSION" | tr -d '[:space:]')"
          newer="$(python3 -c "import sys; p=lambda v: tuple(int(x) for x in v.split('.')); print(p(sys.argv[1]) > p(sys.argv[2]))" "$mine" "$main")"
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- VERSION; then
            echo "No version change: fine for a change that isn't released on its own."; exit 0
          fi
          if [ "$newer" != "True" ]; then
            echo "::error::This branch is $mine but main is already $main. Run scripts/bump-version.sh rebase, then push."
            exit 1
          fi
          [ -f "docs/releases/$mine.md" ] || { echo "::error::docs/releases/$mine.md is missing"; exit 1; }
          echo "$mine is newer than main's $main."

  # 11.15: the repo is public: nothing private in the lines a change adds (scripts/privacy_check.py). PRIVACY_TERMS is
  # a secret: your own list of names and real figures, never in the repo.
  privacy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nothing private added
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
          PRIVACY_BASE: origin/${{ github.base_ref }}
        run: python3 scripts/privacy_check.py

  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/backend
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall app
      - run: pytest -q

  web:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56.1 can't install Chromium.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Visual checks (6.0): main screens at phone and desktop widths, no
      # sideways scrolling, nothing past the screen edge, the dock at the bottom.
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-check
          path: apps/web/visual-check/
          if-no-files-found: ignore

  production-container:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sirisos-ci .
