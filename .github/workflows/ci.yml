name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/backend
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall app
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Visual checks (6.0): main screens at phone and desktop widths, no
      # sideways scrolling, nothing past the screen edge, the dock at the bottom.
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-check
          path: apps/web/visual-check/
          if-no-files-found: ignore

  production-container:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sirisos-ci .
