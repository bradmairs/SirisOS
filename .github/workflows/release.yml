name: Release

# Merging a version bump (VERSION) to main tags it vX.YY and publishes a
# GitHub release from docs/releases/X.YY.md. See docs/releases.md.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"; exit 0
          fi
          notes="docs/releases/$version.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "SirisOS $version" --notes-file "$notes" --latest
