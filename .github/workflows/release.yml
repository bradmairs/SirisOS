name: Release

# Merging a version bump (VERSION) to main tags it vX.Y.Z and publishes a
# GitHub release from docs/releases/X.YY.md. See docs/releases.md.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 11.11: the same number from another change is a clash, not something to skip quietly
            at="$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)"
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ] && ! git merge-base --is-ancestor "$GITHUB_SHA" "$at"; then
              echo "::error::$version was already released from another change ($at). Renumber with scripts/bump-version.sh rebase."
              exit 1
            fi
            echo "$tag already released"; exit 0
          fi
          notes="docs/releases/$version.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "SirisOS $version" --notes-file "$notes" --latest
