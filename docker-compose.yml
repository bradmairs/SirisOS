services:
  web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile.web
      args:
        SIRISOS_API_URL: ${SIRISOS_API_URL:-http://192.168.0.100:8000}
    container_name: sirisos-web
    ports:
      - "6464:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./apps/backend
    container_name: sirisos-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DOCKER_HOST: tcp://docker-proxy:2375
      SIRISOS_ENV: ${SIRISOS_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: sirisos-docker-proxy
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: sirisos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
