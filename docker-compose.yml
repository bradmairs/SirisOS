services:
  web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile.web
      args:
        SIRISOS_API_URL: ${SIRISOS_API_URL:-http://192.168.0.100:8000}
    container_name: sirisos-web
    ports:
      - "6464:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./apps/backend
    container_name: sirisos-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DOCKER_HOST: tcp://docker-proxy:2375
      NODE_EXPORTER_URL: http://node-exporter:9100/metrics
      SIRISOS_ENV: ${SIRISOS_ENV:-development}
      SIRISOS_ADMIN_USERNAME: ${SIRISOS_ADMIN_USERNAME:-brad}
      SIRISOS_ADMIN_PASSWORD: ${SIRISOS_ADMIN_PASSWORD:-change-this-password}
      SIRISOS_JWT_SECRET: ${SIRISOS_JWT_SECRET:-replace-with-a-long-random-secret}
      SIRISOS_JWT_EXPIRY_HOURS: ${SIRISOS_JWT_EXPIRY_HOURS:-24}
      SIRISOS_CPU_WARNING_PERCENT: ${SIRISOS_CPU_WARNING_PERCENT:-80}
      SIRISOS_CPU_CRITICAL_PERCENT: ${SIRISOS_CPU_CRITICAL_PERCENT:-95}
      SIRISOS_MEMORY_WARNING_PERCENT: ${SIRISOS_MEMORY_WARNING_PERCENT:-80}
      SIRISOS_MEMORY_CRITICAL_PERCENT: ${SIRISOS_MEMORY_CRITICAL_PERCENT:-95}
      SIRISOS_DISK_WARNING_PERCENT: ${SIRISOS_DISK_WARNING_PERCENT:-80}
      SIRISOS_DISK_CRITICAL_PERCENT: ${SIRISOS_DISK_CRITICAL_PERCENT:-90}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      HEALTH_AUTO_EXPORT_MCP_URL: ${HEALTH_AUTO_EXPORT_MCP_URL:-}
      HEALTH_AUTO_EXPORT_MCP_TOKEN: ${HEALTH_AUTO_EXPORT_MCP_TOKEN:-}
      HEALTH_AUTO_EXPORT_MCP_TIMEOUT_SECONDS: ${HEALTH_AUTO_EXPORT_MCP_TIMEOUT_SECONDS:-12}
    ports:
      - "8000:8000"
    volumes:
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      node-exporter:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: sirisos-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: sirisos-docker-proxy
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: sirisos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
