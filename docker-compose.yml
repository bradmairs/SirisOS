services:
  sirisos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sirisos
    environment:
      SIRISOS_ADMIN_USERNAME: ${SIRISOS_ADMIN_USERNAME:-brad}
      SIRISOS_ADMIN_PASSWORD: ${SIRISOS_ADMIN_PASSWORD:-change-this-password}
      SIRISOS_JWT_SECRET: ${SIRISOS_JWT_SECRET:-replace-with-a-long-random-secret}
      SIRISOS_JWT_EXPIRY_HOURS: ${SIRISOS_JWT_EXPIRY_HOURS:-24}
      # Engineering module (SirisHydro answer synthesis is optional).
      OLLAMA_URL: ${OLLAMA_URL:-}
      SIRISOS_OLLAMA_CHAT_MODEL: ${SIRISOS_OLLAMA_CHAT_MODEL:-}
      SIRISOS_OLLAMA_CHAT_TIMEOUT_SECONDS: ${SIRISOS_OLLAMA_CHAT_TIMEOUT_SECONDS:-30}
      SIRISOS_STANDARDS_PATH: /app/data/standards
      SIRISOS_STANDARDS_MAX_UPLOAD_MB: ${SIRISOS_STANDARDS_MAX_UPLOAD_MB:-100}
      SIRISOS_STANDARDS_OCR_ENABLED: ${SIRISOS_STANDARDS_OCR_ENABLED:-true}
      SIRISOS_STANDARDS_OCR_LANGUAGE: ${SIRISOS_STANDARDS_OCR_LANGUAGE:-eng}
      SIRISOS_STANDARDS_OCR_TIMEOUT_SECONDS: ${SIRISOS_STANDARDS_OCR_TIMEOUT_SECONDS:-300}
      SIRISOS_STANDARDS_MIN_NATIVE_TEXT_CHARS: ${SIRISOS_STANDARDS_MIN_NATIVE_TEXT_CHARS:-40}
      # Daily brief (ADR 108): opens by itself between these hours, local time.
      SIRISOS_TIMEZONE: ${SIRISOS_TIMEZONE:-Australia/Melbourne}
      SIRISOS_BRIEF_FROM_HOUR: ${SIRISOS_BRIEF_FROM_HOUR:-4}
      SIRISOS_BRIEF_UNTIL_HOUR: ${SIRISOS_BRIEF_UNTIL_HOUR:-9}
      SIRISOS_BRIEF_STATE_PATH: /app/data/brief-state.json
      # Phone notifications (1.5): who push services contact, and when the brief notification goes out.
      SIRISOS_VAPID_SUBJECT: ${SIRISOS_VAPID_SUBJECT:-}
      SIRISOS_PUSH_BRIEF_HOUR: ${SIRISOS_PUSH_BRIEF_HOUR:-7}
      SIRISOS_WRAPUP_HOUR: ${SIRISOS_WRAPUP_HOUR:-17}
      SIRISOS_REVIEW_WEEKDAY: ${SIRISOS_REVIEW_WEEKDAY:-6}
      SIRISOS_REVIEW_HOUR: ${SIRISOS_REVIEW_HOUR:-16}
      SIRISOS_PUSH_ENABLED: ${SIRISOS_PUSH_ENABLED:-1}
      SIRISOS_PASSKEY_RP_ID: ${SIRISOS_PASSKEY_RP_ID:-}
      # Terminal (2.8): hosts SirisOS may open a shell on, as name=user@host[:port], comma-separated.
      # Blank = the terminal is off. Every session needs a fresh 2FA code.
      SIRISOS_TERMINAL_HOSTS: ${SIRISOS_TERMINAL_HOSTS:-}
      SIRISOS_TERMINAL_IDLE_MINUTES: ${SIRISOS_TERMINAL_IDLE_MINUTES:-15}
      SIRISOS_TERMINAL_MAX_MINUTES: ${SIRISOS_TERMINAL_MAX_MINUTES:-120}
      SIRISOS_TERMINAL_COMMAND_SECONDS: ${SIRISOS_TERMINAL_COMMAND_SECONDS:-60}
      # Hub connectors (ADR 106). Blank = tile shows "not configured".
      SIRISOS_HUB_VERIFY_SSL: ${SIRISOS_HUB_VERIFY_SSL:-true}
      SIRISAI_URL: ${SIRISAI_URL:-}
      SIRISAI_API_KEY: ${SIRISAI_API_KEY:-}
      SIRISAI_PUBLIC_URL: ${SIRISAI_PUBLIC_URL:-}
      # ADR 110: who to act as in SirisAI (opt-in), and the key SirisAI uses
      # to read the engineering library and app states here.
      SIRISAI_USER: ${SIRISAI_USER:-}
      SIRISOS_SERVICE_KEY: ${SIRISOS_SERVICE_KEY:-}
      SIRISOS_ATTENTION_STATE_PATH: /app/data/attention-state.json
      REVIEWER_URL: ${REVIEWER_URL:-}
      REVIEWER_PUBLIC_URL: ${REVIEWER_PUBLIC_URL:-}
      REVIEWER_USERNAME: ${REVIEWER_USERNAME:-}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-}
      ARCHIVE_URL: ${ARCHIVE_URL:-}
      ARCHIVE_PUBLIC_URL: ${ARCHIVE_PUBLIC_URL:-}
      ARCHIVE_API_KEY: ${ARCHIVE_API_KEY:-}
      SIRISDRONE_URL: ${SIRISDRONE_URL:-}
      SIRISDRONE_PUBLIC_URL: ${SIRISDRONE_PUBLIC_URL:-}
      SIRISDRONE_USERNAME: ${SIRISDRONE_USERNAME:-}
      SIRISDRONE_PASSWORD: ${SIRISDRONE_PASSWORD:-}
      SIRISLEARN_URL: ${SIRISLEARN_URL:-}
      SIRISLEARN_PUBLIC_URL: ${SIRISLEARN_PUBLIC_URL:-}
      SIRISLEARN_HUB_KEY: ${SIRISLEARN_HUB_KEY:-}
    ports:
      - "${SIRISOS_PORT:-8094}:6464"
    volumes:
      - ./data/logs:/app/logs
      - ./data/app:/app/data
      - ./data/standards:/app/data/standards
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6464/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # HTTPS on SIRISOS_HTTPS_PORT (default 8444), so the Siris voice orb can use
  # the microphone. See deploy/caddy/Caddyfile.
  https:
    image: caddy:2-alpine
    container_name: sirisos-https
    ports:
      - "${SIRISOS_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - sirisos
    restart: unless-stopped

volumes:
  caddy_data:
